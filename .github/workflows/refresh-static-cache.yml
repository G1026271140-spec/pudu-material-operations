name: Refresh static data cache

on:
  schedule:
    - cron: "0 2 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
  repository_dispatch:
    types:
      - refresh-static-cache

permissions:
  contents: write

concurrency:
  group: refresh-static-data-cache
  cancel-in-progress: false

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate static cache files
        run: |
          python scripts/generate_page_data_cache.py
          python scripts/generate_request_form_cache.py
          python scripts/generate_contact_departments_cache.py

      - name: Commit refreshed cache
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/page_data_cache.json data/request_form_cache.json data/contact_departments_cache.json
          if git diff --cached --quiet; then
            echo "Static cache is already current."
            exit 0
          fi
          if [ "$(git log -1 --pretty=%s)" = "Refresh static data cache" ] && \
             [ "$(git log -1 --pretty=%an)" = "github-actions[bot]" ]; then
            git commit --amend --no-edit
            git push --force-with-lease origin HEAD:master
          else
            git commit -m "Refresh static data cache"
            git push origin HEAD:master
          fi
