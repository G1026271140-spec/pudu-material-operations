name: Validate release consistency

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/validate_release_consistency.py
      - run: python scripts/validate_page_data_cache.py
      - run: python scripts/validate_request_form_cache.py
